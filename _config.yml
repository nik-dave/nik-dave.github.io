# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Nik Dave"
title: "Senior Engineer | PhD Mechanical Engineering"
department: ""
college: ""
institution: "ASML"
institution_location: "Veldhoven, The Netherlands"
email: Nik.Dave@asml.com
phone: ""  # shown on About/Team PI cards and the generated CV header; leave blank to omit
office: ""  # shown on About/Team PI cards and the generated CV header
office_city: ""  # appended to office on the CV header only; if office and office_city are both blank the CV falls back to institution_location
photo: profile/photo_NikDave.png  # place your photo in images/ -- used for the on-page avatar (About/Team/sidebar)
share_image: profile/photo_NikDave.png  # place your photo in images/ -- used only for social-share preview (og:image)

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: ""
  github: "https://github.com/Nik-Dave"
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: "files/cv.pdf"  # auto-generated at build time from cv/cv.md — leave blank to hide the CV icon
  youtube: ""

# ============================================================
# STEP 3: Site Settings
# ============================================================
# Brand color for non-CSS assets only (favicon.svg), which can't read CSS
# variables. The site's actual accent colors are a four-rung scale
# (wash/soft/base/deep) with separate light and dark values — too much for one
# key — and live in _sass/base/_variables.scss. Keep this in sync with the
# --accent rung there.
accent_color: "#1565C0" #"#2196F3"
dark_mode: true              # show dark mode toggle in navbar
description: "Senior Engineer and PhD specialising in semiconductor systems, particle transport, defectivity engineering, experimental diagnostics, CFD and computational modelling."
baseurl: ""
url: "https://nik-dave.github.io"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: skills
  - name: research
  - name: projects

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Dave
  first_name: [Nik]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - package-lock.json
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - cv          # CV markdown source; rendered to files/cv.pdf by CI
  - package.json
  - docs
