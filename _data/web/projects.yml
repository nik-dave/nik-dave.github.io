  status: "Ongoing"
  stack:
    - "Python"
    - "Trajectory Processing"
    - "Engineering Data Analysis"
    - "Statistical Analysis"
    - "Scientific Visualisation"
    - "Quality Assessment"
  abstract: >
    Development of a Python-based engineering tool for processing and analysing
    three-dimensional particle trajectories obtained from optical measurements.
    The tool supports trajectory preparation, inspection, incident-versus-
    reflected classification, calculation of velocity and angular distributions,
    data-quality checks, statistical comparison and visualisation of particle
    behaviour. The aim is to convert complex trajectory datasets into repeatable
    and interpretable engineering results.
