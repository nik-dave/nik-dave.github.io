# -----------------------------------------------------------------------------
# PARTICLE TRANSPORT EXPERIMENTAL PLATFORM
# -----------------------------------------------------------------------------

- title: "Atmospheric Particle Transport Diagnostic Platform"
  image: "projects/particle_transport_diagnostics.png"
  start_date: "2025-01"
  end_date: "2026-12"
  role: "Research Engineer — experimental design, diagnostics and technical analysis"
  status: "Ongoing"

  stack:
    - "3D Particle Tracking Velocimetry"
    - "LaVision DaVis"
    - "Optical Diagnostics"
    - "Experimental Design"
    - "Camera Calibration"
    - "Particle Injection"
    - "Measurement Validation"
    - "Scientific Data Analysis"

  abstract: >
    Development of an atmospheric test platform for studying micron-scale
    particle transport and particle-surface interaction. The platform combines
    controlled particle injection, synchronised optical imaging,
    three-dimensional Particle Tracking Velocimetry and structured test
    execution. Reconstructed trajectories are used to investigate particle
    velocities, directions, impact conditions and reflected behaviour. The
    project covers measurement concept development, experimental integration,
    calibration, test execution, data-quality assessment and validation of the
    diagnostic methodology.

