- title: "Particle Transport Diagnostics in Atmospheric Conditions"
  image: "projects/particle_transport_diagnostics.png"
  start_date: "2025-08"
  end_date: "2025-12"
  role: "Research Engineer — experiment design, diagnostics, data processing, trajectory analysis"
  status: "Completed"

  stack:
    - "Python"
    - "NumPy"
    - "SciPy"
    - "Pandas"
    - "OpenCV"
    - "Matplotlib"
    - "Particle Tracking Velocimetry (PTV)"
    - "Experimental Diagnostics"

  abstract: >
    Micron-sized particles are tracked using optical diagnostics and
    Particle Tracking Velocimetry (PTV) under atmospheric conditions.
    Reconstructed trajectories are analysed to quantify particle
    transport, incident and reflected velocity distributions, impact
    angles, and particle-surface interaction behaviour.

