# PARTICLE-TRAJECTORY DATA PROCESSING
# -----------------------------------------------------------------------------

- title: "Three-Dimensional Particle Trajectory Analysis Workflow"
  image: "research/2025_PTV_DUV.png"
  start_date: "2025-01"
  end_date: "2026-12"
  role: "Developer and Analyst — trajectory processing, classification and visualisation"
  status: "Ongoing"

  stack:
    - "Python"
    - "NumPy"
    - "Pandas"
    - "SciPy"
    - "Matplotlib"
    - "3D Trajectory Analysis"
    - "Statistical Analysis"
    - "Scientific Visualisation"

  abstract: >
    Development of a structured analysis workflow for processing
    three-dimensional particle trajectories obtained from optical measurements.
    The workflow supports data preparation, trajectory inspection,
    incident-versus-reflected particle classification and calculation of
    velocity and angular distributions. It also supports quality checks,
    statistical comparison and engineering visualisation of particle behaviour.
    The objective is to convert complex trajectory datasets into reproducible
    and interpretable engineering results.

  links:
