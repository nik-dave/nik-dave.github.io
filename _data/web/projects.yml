- title: "Multiscale Liquid-Transport Modelling Toolkit"
  image: "projects/liquid_transport_models.png"
  start_date: "2018-09"
  end_date: "2022-12"
  role: "Doctoral Researcher — mathematical formulation, implementation and analysis"
  status: "Completed"
  stack:
    - "MATLAB"
    - "Python"
    - "Porous-Media Transport"
    - "Capillary Flow"
    - "Numerical Methods"
    - "Multiscale Modelling"
    - "Model Verification"
  abstract: >
    Development of analytical and numerical models for through-thickness liquid
    transport in porous-fibrous paper materials. The toolkit represented pore
    transport, fibre-liquid mass exchange and evolving moisture distributions
    across relevant material scales. MATLAB and Python implementations supported
    parameter studies, comparison of modelling assumptions and interpretation of
    transport behaviour relevant to industrial printing applications.
  links:
    webpage: ""
    github: ""
    demo: ""
    docs: ""
    blog: ""

- title: "Hygro-Elastic Swelling and Dimensional-Stability Model"
  image: "projects/hygroelastic_swelling.png"
  start_date: "2018-09"
  end_date: "2022-12"
  role: "Doctoral Researcher — coupled modelling, implementation and validation"
  status: "Completed"
  stack:
    - "MATLAB"
    - "Hygro-Mechanics"
    - "Material Anisotropy"
    - "Dimensional Stability"
    - "Constitutive Modelling"
    - "Numerical Analysis"
  abstract: >
    Development of a coupled hygro-elastic model for predicting moisture-induced
    swelling and dimensional changes in paper sheets. The model connected fibre-
    level properties, anisotropic sheet behaviour and non-uniform moisture fields
    to evaluate in-plane deformation and dimensional stability. It supported
    sensitivity studies and comparison between analytical, numerical and
    experimentally informed material descriptions.
  links:
    webpage: ""
    github: ""
    demo: ""
    docs: ""
    blog: ""

- title: "Finite-Element Models of Paper Fibre Bonds and Networks"
  image: "projects/paper_fibre_networks.png"
  start_date: "2018-09"
  end_date: "2022-12"
  role: "Doctoral Researcher — finite-element modelling and computational homogenisation"
  status: "Completed"
  stack:
    - "MSC Marc/Mentat"
    - "Finite Element Method"
    - "Fibre Bonds"
    - "Fibrous Networks"
    - "Computational Homogenisation"
    - "Material Modelling"
  abstract: >
    Construction and analysis of finite-element models representing individual
    paper-fibre bonds and idealised fibrous networks in MSC Marc/Mentat. The
    models were used to investigate how fibre arrangement, bonding, waviness and
    local deformation influence the effective mechanical and hygro-expansive
    response of paper. The resulting simulations supported comparison between
    simplified analytical descriptions and detailed network representations.
  links:
    webpage: ""
    github: ""
    demo: ""
    docs: ""
    blog: ""

- title: "Scale-Separation Models for Moisture-Induced Paper Curl"
  image: "projects/paper_curl_multiscale.png"
  start_date: "2018-09"
  end_date: "2022-12"
  role: "Doctoral Researcher — multiscale finite-element modelling and analysis"
  status: "Completed"
  stack:
    - "MSC Marc/Mentat"
    - "Multiscale Modelling"
    - "Scale Separation"
    - "Hygro-Elasticity"
    - "Paper Curl"
    - "Computational Homogenisation"
  abstract: >
    Development of scale-separation models in MSC Marc/Mentat for predicting
    moisture-induced curl of paper sheets. The modelling framework connected
    fibre-network response, homogenised hygro-elastic material properties,
    through-thickness moisture gradients and sheet-scale bending. Multiple model
    resolutions were used to assess the accuracy and limitations of simplified
    curl predictions relative to detailed three-dimensional network models.
  links:
    webpage: ""
    github: ""
    demo: ""
    docs: ""
    blog: ""

