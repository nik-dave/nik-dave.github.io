- title: "Atmospheric Particle Transport Diagnostic Platform"
  image: "projects/particle_transport_diagnostics.png"
  start_date: "2025-01"
  #end_date: "2026-12"
  role: "Research Engineer — experimental design, diagnostics and technical analysis"
  status: "Ongoing"
  stack:
    - "3D Particle Tracking Velocimetry"
    - "LaVision DaVis"
    - "Optical Diagnostics"
    - "Experimental Design"
    - "Camera Calibration"
    - "Particle Injection"
    - "Measurement Validation"
  abstract: >
    Development of an atmospheric experimental platform for investigating
    micron-scale particle transport and particle-surface interaction. The
    platform integrates controlled particle introduction, synchronised optical
    imaging, volumetric calibration, three-dimensional Particle Tracking
    Velocimetry and structured test execution. The resulting capability supports
    repeatable measurement of particle trajectories, velocities, directions and
    impact conditions for semiconductor defectivity investigations.
  links:
