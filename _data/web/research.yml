  abstract: >
    Experimental investigation of micron-scale particle transport and
    particle-surface interaction under atmospheric conditions. The work combines
    controlled particle injection, optical diagnostics and trajectory analysis
    to characterise incident and reflected particle motion, including velocity
    and angular distributions. The measurements support improved understanding
    of particle behaviour, contamination mechanisms and experimental validation
    in semiconductor engineering applications.
