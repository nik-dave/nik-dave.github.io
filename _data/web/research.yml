    supplementary: ""


- title: "Atmospheric Three-Dimensional Particle Tracking Velocimetry"
  image: "research/2025_PTV_DUV.png"
  focus: [1, 2, 5]
  start_date: "2025-01"
  authors:
    - name: "Nik Dave"
    - name: "Gijs Peters"
  mentors: []
  keywords:
    - "3D PTV"
    - "Particle Tracking Velocimetry"
    - "Optical Diagnostics"
    - "Particle Trajectories"
    - "Camera Calibration"
    - "Velocity Measurement"
    - "Data Processing"
    - "Experimental Validation"
  abstract: >
    Application of three-dimensional Particle Tracking Velocimetry to reconstruct
    micron-scale particle trajectories in atmospheric test conditions. The
    methodology combines synchronised imaging, volumetric calibration, particle
    identification, trajectory reconstruction and statistical processing to
    determine particle velocities and directions before and after interaction
    with a surface. The work also addresses measurement uncertainty, optical
    accessibility and the practical limitations of resolving individual particle
    events in controlled experiments.
  links:
    paper: ""
    webpage: ""
    video: []
