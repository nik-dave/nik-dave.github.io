# SEMICONDUCTOR SYSTEMS, PARTICLE TRANSPORT AND EXPERIMENTAL DIAGNOSTICS
# -----------------------------------------------------------------------------

- title: "Particle Transport and Surface Interaction Diagnostics"
  image: "research/2025_PTV_DUV.png"
  focus: [1, 2]
  start_date: "2025-01"
  authors:
    - name: "Nik Dave"
    - name: "Gijs Peters"
  mentors: []
  keywords:
    - "Particle Transport"
    - "Particle-Surface Interaction"
    - "Contamination"
    - "Incident Particles"
    - "Reflected Particles"
    - "Experimental Diagnostics"
    - "Trajectory Analysis"
    - "Semiconductor Systems"
  abstract: >
    Development of an experimental methodology for characterising micron-scale
    particle transport and particle-surface interaction under atmospheric
    conditions. The work combines controlled particle injection, optical
    diagnostics and trajectory reconstruction to evaluate incident and reflected
    particle motion, including velocity and angular distributions. The resulting
    measurements support improved understanding of particle behaviour,
    contamination mechanisms and experimental validation within semiconductor
    engineering applications.
  links:
    paper: ""
    webpage: ""
