# Research projects — shown on the Research page and linked from the Lab page Research Focus section.
# Projects are sorted in reverse chronological order by end_date.
#
# Required fields:
#   title       — full project title (also used to generate the anchor ID on the Research page)
#   image       — path relative to /images/, e.g. "research/2026_myproject.jpg"
#   end_date    — YYYY-MM, used for sorting (use an estimated date for ongoing work)
#   abstract    — one-paragraph summary
#
# Optional fields:
#   start_date  — YYYY-MM
#   focus       — list of Research Area IDs (1–5) defined in _data/research_areas.yml
#                 A project can belong to multiple areas, e.g. focus: [2, 5]
#                 1 = CFD, Thermal engineering
#                 2 = FEM, numerical modelling
#                 3 = Semiconductor metrology
#                 4 = Experimental diagnostics, validation 
#                 5 = Particle Tracking Velocimetry
#   keywords    — list of tags shown on the Research page and used by the Keyword filter
#   authors     — list of {name, url} (name must match people.yml for auto-linking)
#   mentors     — list of {name, url} (same auto-linking rules as authors)
#   links:
#     paper     — filename in /papers/ (e.g. "Dave2024.pdf"), OR a full external URL
#     webpage   — full external URL
#     video     — list of {url, date}, e.g.:
#                   video:
#                     - url: "https://youtu.be/xxxx"
#                       date: "2026-09"   # YYYY-MM, own date (not tied to end_date), used to sort /videos/
#                 A project can have multiple videos, each with its own date. Empty list [] if none.
#     poster    — path relative to site root, must include "files/posters/" prefix, e.g. "files/posters/2026_myposter.pdf"
#     slide     — path relative to site root, must include "files/slides/" prefix, e.g. "files/slides/2026_myslide.pdf"
#     bib       — full external URL to BibTeX / citation page
#     github    — full external URL to GitHub repository


