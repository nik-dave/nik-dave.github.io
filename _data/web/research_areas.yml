- id: 2
  name: "Particle Transport, Contamination & Experimental Diagnostics"
  image: "research/2025_PTV_DUV.png"
  description: >
    Experimental investigation of micron-scale particle transport, contamination
    behaviour and particle-surface interaction. This area includes optical
    diagnostics, three-dimensional trajectory reconstruction, velocity and
    angle analysis, measurement uncertainty and experimental validation.
  projects:
