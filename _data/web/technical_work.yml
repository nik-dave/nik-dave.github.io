- title: "Multiscale Liquid Transport in Porous Materials"
  image: "research/Liquid_transport.png"
  focus: [3, 5]
  start_date: "2018-09"
  end_date: "2022-12"
  status: "Completed"
  context: "Industrial doctoral research in porous-fibrous materials and printing"
  role: "Doctoral Researcher — mathematical formulation, implementation and analysis"
  summary: >
    Investigation of through-thickness liquid transport in paper based porous
    materials using multiscale analytical and numerical modelling. The work
    examined how pore structure, material heterogeneity and liquid-material
    interaction influence transport across different spatial and temporal
    scales, with application to industrial printing processes.
  contributions:
    - "Developed analytical and numerical descriptions of pore scale and through-thickness liquid transport."
    - "Implemented MATLAB and Python models for transport, fibre-liquid mass exchange and evolving moisture distributions."
    - "Performed parameter studies and comparisons between modelling assumptions and material scale descriptions."
  deliverables:
    - "Multiscale liquid transport modelling toolkit"
    - "MATLAB and Python transport models"
    - "Parameter study and model comparison workflows"
