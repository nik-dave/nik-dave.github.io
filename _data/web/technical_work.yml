- title: "Hygro-Mechanical Dimensional Stability of Paper Sheets"
  image: "research/Paper_curl.png"
  focus: [3, 5]
  start_date: "2018-09"
  end_date: "2022-12"
  status: "Completed"
  context: "Industrial doctoral research in paper mechanics and dimensional stability"
  role: "Doctoral Researcher — coupled modelling, implementation and validation"
  summary: >
    Study of moisture driven dimensional changes in paper sheets using coupled
    hygro-mechanical modelling. The research investigated relationships between
    moisture transport, material anisotropy, local deformation and sheet scale
    dimensional stability across multiple material scales.
  contributions:
    - "Developed a coupled hygro-elastic swelling model for moisture induced dimensional change."
    - "Connected fibre level properties, anisotropic sheet behaviour and non-uniform moisture fields."
    - "Developed scale separation models for predicting moisture induced sheet curl and assessing model fidelity."
  deliverables:
