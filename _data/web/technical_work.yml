- title: "Particle Transport and Surface Interaction Diagnostics"
  image: "research/2025_PTV_surface.png"
  focus: [1, 2]
  start_date: "2025-01"
  status: "Ongoing"
  context: "Semiconductor defectivity and experimental diagnostics"
  role: "Mechanical Engineer / Research Engineer — experimental development, analysis and technical coordination"
  summary: >
    Experimental investigation of micron scale particle transport and
    particle surface interaction under atmospheric conditions. The work
    characterises incident and reflected particle motion, including velocity
    and angular distributions, to improve understanding of particle behaviour
    and contamination mechanisms in semiconductor engineering applications.
  contributions:
    - "Developed and integrated an atmospheric particle transport diagnostic platform for repeatable experimental investigations."
    - "Defined experimental methods for controlled particle introduction, surface interaction and optical measurement."
    - "Developed analysis approaches for incident versus reflected particle trajectories, velocity distributions and impact/reflection angles."
  deliverables:
    - "Atmospheric particle transport diagnostic platform"
    - "Particle surface interaction measurement methodology"
    - "Trajectory analysis and statistical evaluation capability"
