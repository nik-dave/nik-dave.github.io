# =============================================================================
# technical_work.yml
# Single source of truth for the combined Research & Engineering portfolio.
#
# Page purpose:
#   Show the engineering problem investigated AND the tangible contribution or
#   deliverable produced, without duplicating Research and Projects pages.
#
# Focus areas:
#   1 = Semiconductor Systems, Metrology & Defectivity
#   2 = Particle Transport, Contamination & Experimental Diagnostics
#   3 = Multiphysics & Multiscale Modelling of Materials
#   4 = Computational Fluid Dynamics (CFD) & Thermal Management
#   5 = Numerical Methods, FEM & Computational Engineering
#
# Conventions:
#   - Items are intended to be sorted by start_date, newest first.
#   - Ongoing work omits end_date and uses status: "Ongoing".
#   - Images are relative to /images/.
#   - Keep employer related descriptions public safe and high level.
# =============================================================================

