- title: "Multiphysics and Fibre Network Modelling Across Material Scales"
  image: "research/Multiscale.png"
  focus: [3, 5]
  start_date: "2018-09"
  end_date: "2022-12"
  status: "Completed"
  context: "Industrial doctoral research in fibrous networks and computational homogenisation"
  role: "Doctoral Researcher — finite element modelling and multiscale analysis"
  summary: >
    Development and application of analytical and finite element methods for
    coupled physical problems across fibre, network and sheet scales. The work
    combined constitutive modelling, idealised fibrous networks, computational
    homogenisation and multiscale approaches to connect local fibre behaviour to
    effective material response.
  contributions:
