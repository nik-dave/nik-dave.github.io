- title: "Atmospheric Three Dimensional Particle Tracking Velocimetry"
  image: "research/2025_PTV_DUV2.png"
  focus: [1, 2, 5]
  start_date: "2025-01"
  status: "Ongoing"
  context: "Volumetric optical diagnostics for particle transport measurements"
  role: "Research Engineer — PTV development, calibration, processing and validation"
  summary: >
    Development and application of three dimensional Particle Tracking
    Velocimetry for reconstructing micron scale particle trajectories in
    atmospheric test conditions. The methodology combines synchronised imaging,
    volumetric calibration, particle identification, trajectory reconstruction
    and statistical processing to quantify particle velocities and directions.
  contributions:
    - "Developed the experimental and processing workflow for volumetric particle trajectory measurements."
